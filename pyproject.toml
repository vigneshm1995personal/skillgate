[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgate-ai"
version = "0.7.17"
description = "Evaluate agent skills before you ship them: catch regressions, pick the best model on cost vs quality, and deploy to Cursor, Claude and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Skill Gate AI contributors" }]
keywords = [
  "agent-skills",
  "ai-agents",
  "llm-evaluation",
  "evals",
  "claude-code",
  "cursor",
  "codex",
  "cli",
  "ci",
  "skills",
  "agentskills",
  "sandbox",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://www.skill-gate-ai.app/"
Documentation = "https://www.skill-gate-ai.app/docs"
Source = "https://github.com/vigneshm1995personal/skillgate"
Issues = "https://github.com/vigneshm1995personal/skillgate/issues"
Changelog = "https://github.com/vigneshm1995personal/skillgate/blob/main/CHANGELOG.md"

[project.scripts]
skillgate-ai = "skillgate_ai.cli:app"
skillgate = "skillgate_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillgate_ai*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "skillgate_build.build_py"
sdist = "skillgate_build.sdist"

[tool.setuptools.package-data]
skillgate_ai = [
  "local_ui/static/*",
  "web_static/*",
  "web_static/**/*",
  "examples/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 120
markers = ["slow: integration tests (git install, etc.)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer/FastAPI declare CLI and form params with Option/Form/File defaults.
"src/skillgate_ai/cli*.py" = ["B008"]
"src/skillgate_ai/api_evals.py" = ["B008"]
"src/skillgate_ai/api_skills.py" = ["B008"]
# setuptools cmdclass names must match the setuptools command classes.
"src/skillgate_build.py" = ["N801"]
# Fixture copy / JS-in-Python strings that cannot wrap without changing values.
"tests/test_qa_0712_wording.py" = ["E501"]
"tests/test_local_ui.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
pretty = true
mypy_path = "src"
explicit_package_bases = true
exclude = [
  '(?x)(src/skillgate_ai/examples/)',
]

# Lenient baseline: existing modules with deep Any/union noise. Tighten
# later instead of a behavior-adjacent annotation sweep.
[[tool.mypy.overrides]]
module = [
  "skillgate_ai.advice",
  "skillgate_ai.api",
  "skillgate_ai.api_compare",
  "skillgate_ai.api_runs",
  "skillgate_ai.case_import",
  "skillgate_ai.case_pack",
  "skillgate_ai.catalog",
  "skillgate_ai.checks_show",
  "skillgate_ai.cli",
  "skillgate_ai.cli_pack",
  "skillgate_ai.compare",
  "skillgate_ai.compare_git",
  "skillgate_ai.engine",
  "skillgate_ai.gate",
  "skillgate_ai.harness",
  "skillgate_ai.helper",
  "skillgate_ai.judge",
  "skillgate_ai.judge_context",
  "skillgate_ai.judge_images",
  "skillgate_ai.judge_openai",
  "skillgate_ai.judge_settings",
  "skillgate_ai.judge_spec",
  "skillgate_ai.local_ui.api",
  "skillgate_ai.local_ui.server",
  "skillgate_ai.mode",
  "skillgate_ai.pack_edit",
  "skillgate_ai.report",
  "skillgate_ai.run_lock",
  "skillgate_ai.sandbox",
  "skillgate_ai.scaffold",
  "skillgate_ai.span_facts",
  "skillgate_ai.usage",
  "skillgate_ai.workspace_outputs",
]
ignore_errors = true
