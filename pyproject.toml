[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgate-ai"
version = "0.7.16"
description = "Evaluate agent skills before you ship them: catch regressions, pick the best model on cost vs quality, and deploy to Cursor, Claude and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Skill Gate AI contributors" }]
keywords = [
  "agent-skills",
  "ai-agents",
  "llm-evaluation",
  "evals",
  "claude-code",
  "cursor",
  "codex",
  "cli",
  "ci",
  "skills",
  "agentskills",
  "sandbox",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.urls]
Homepage = "https://www.skill-gate-ai.app/"
Documentation = "https://www.skill-gate-ai.app/docs"
Source = "https://github.com/vigneshm1995personal/skillgate"
Issues = "https://github.com/vigneshm1995personal/skillgate/issues"
Changelog = "https://github.com/vigneshm1995personal/skillgate/blob/main/CHANGELOG.md"

[project.scripts]
skillgate-ai = "skillgate_ai.cli:app"
skillgate = "skillgate_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillgate_ai*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "skillgate_build.build_py"
sdist = "skillgate_build.sdist"

[tool.setuptools.package-data]
skillgate_ai = [
  "local_ui/static/*",
  "web_static/*",
  "web_static/**/*",
  "examples/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 120
markers = ["slow: integration tests (git install, etc.)"]

[tool.ruff]
line-length = 100
target-version = "py311"
