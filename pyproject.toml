[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgate-ai"
version = "0.7.19"
description = "Evaluate agent skills before you ship them: catch regressions, pick the best model on cost vs quality, and deploy to Cursor, Claude and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Skill Gate AI contributors" }]
keywords = [
  "agent-skills",
  "ai-agents",
  "llm-evaluation",
  "evals",
  "claude-code",
  "cursor",
  "codex",
  "cli",
  "ci",
  "skills",
  "agentskills",
  "sandbox",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]
docs = [
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.2",
]
mcp = [
  "mcp>=1.9,<2",
]
all = [
  "skillgate-ai[ui,docs,mcp]",
]
dev = [
  "skillgate-ai[all]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=4.0",
  "pip-audit>=2.7",
  "import-linter>=2.1",
]

[project.urls]
Homepage = "https://www.skill-gate-ai.app/"
Documentation = "https://www.skill-gate-ai.app/docs"
Source = "https://github.com/vigneshm1995personal/skillgate"
Issues = "https://github.com/vigneshm1995personal/skillgate/issues"
Changelog = "https://github.com/vigneshm1995personal/skillgate/blob/main/CHANGELOG.md"

[project.scripts]
skillgate-ai = "skillgate_ai.cli:app"
skillgate = "skillgate_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillgate_ai*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "skillgate_build.build_py"
sdist = "skillgate_build.sdist"

[tool.setuptools.package-data]
skillgate_ai = [
  "web_static/*",
  "web_static/**/*",
  "examples/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 120
markers = [
    "slow: integration tests (git install, etc.)",
    "integration: CLI-to-gate E2E under tests/integration (fake agent + fake decision HTTP; live smoke opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
# Typer/FastAPI declare CLI and form params with Option/Form/File defaults.
"src/skillgate_ai/cli/*.py" = ["B008"]
"src/skillgate_ai/cli*.py" = ["B008"]
"src/skillgate_ai/api_evals.py" = ["B008"]
"src/skillgate_ai/api_skills.py" = ["B008"]
"src/skillgate_ai/checks_show.py" = ["B008"]
"src/skillgate_ai/api.py" = ["B008"]
"src/skillgate_ai/api_runs.py" = ["B008"]
"src/skillgate_ai/api_compare.py" = ["B008"]
"src/skillgate_ai/api_shims.py" = ["B008"]
# setuptools cmdclass names must match the setuptools command classes.
"src/skillgate_build.py" = ["N801"]
# Fixture copy / JS-in-Python strings that cannot wrap without changing values.
"tests/test_wording_facts.py" = ["E501"]
# Single-line JSON golden literals; wrapping would change the contract under test.
"tests/test_wire_shapes.py" = ["E501"]
# Tests use assert, subprocess, temp paths and fake secrets by design.
"tests/**/*.py" = ["S"]
# Seed skill packs are hashed fixtures shipped as examples; their scripts are agent-side code.
"skills/**/scripts/*.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
pretty = true
mypy_path = "src"
explicit_package_bases = true
exclude = [
  '(?x)(src/skillgate_ai/examples/)',
]

[[tool.mypy.overrides]]
module = [
  "skillgate_ai.paths",
  "skillgate_ai.catalog",
  "skillgate_ai.sandbox",
  "skillgate_ai.local_guard",
  "skillgate_ai.trusted_roots",
  "skillgate_ai.fs_anchor",
  "skillgate_ai.contained_fs",
  "skillgate_ai.pack_layout",
  "skillgate_ai.pack_io",
  "skillgate_ai.allow_root",
  "skillgate_ai.path_traversal",
  "skillgate_ai.agent_roots",
  "skillgate_ai.scrub",
]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[tool.coverage.run]
source = ["skillgate_ai"]

[tool.coverage.report]
fail_under = 84.0
precision = 2
skip_covered = true

[tool.importlinter]
root_package = "skillgate_ai"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "FS core does not import domain or surfaces"
type = "forbidden"
source_modules = [
  "skillgate_ai.path_traversal",
  "skillgate_ai.fs_anchor",
  "skillgate_ai.contained_fs",
  "skillgate_ai.pack_layout",
  "skillgate_ai.allow_root",
  "skillgate_ai.pack_io",
  "skillgate_ai.paths",
  "skillgate_ai.trusted_roots",
  "skillgate_ai.agent_roots",
]
forbidden_modules = [
  "skillgate_ai.deploy",
  "skillgate_ai.deploy_gate",
  "skillgate_ai.history",
  "skillgate_ai.catalog",
  "skillgate_ai.ingest",
  "skillgate_ai.pack",
  "skillgate_ai.engine",
  "skillgate_ai.gate",
  "skillgate_ai.case_pack",
  "skillgate_ai.harness",
  "skillgate_ai.judge",
  "skillgate_ai.judge_openai",
  "skillgate_ai.cli",
  "skillgate_ai.api",
  "skillgate_ai.api_payloads",
  "skillgate_ai.api_models",
  "skillgate_ai.api_intake",
  "skillgate_ai.api_evals",
  "skillgate_ai.api_skills",
  "skillgate_ai.api_runs",
  "skillgate_ai.api_compare",
  "skillgate_ai.api_shims",
  "skillgate_ai.server",
  "skillgate_ai.checks_show",
  "skillgate_ai.mcp",
]

[[tool.importlinter.contracts]]
name = "Domain does not import HTTP, CLI or MCP surfaces"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "skillgate_ai.engine",
  "skillgate_ai.gate",
  "skillgate_ai.history",
  "skillgate_ai.deploy",
  "skillgate_ai.deploy_gate",
  "skillgate_ai.case_pack",
  "skillgate_ai.harness",
  "skillgate_ai.judge_openai",
  "skillgate_ai.report",
  "skillgate_ai.compare",
  "skillgate_ai.run_registry",
  "skillgate_ai.run_status",
  "skillgate_ai.scrub",
  "skillgate_ai.agent_roots",
]
forbidden_modules = [
  "skillgate_ai.api",
  "skillgate_ai.api_payloads",
  "skillgate_ai.api_models",
  "skillgate_ai.api_intake",
  "skillgate_ai.api_evals",
  "skillgate_ai.api_skills",
  "skillgate_ai.api_runs",
  "skillgate_ai.api_compare",
  "skillgate_ai.api_shims",
  "skillgate_ai.server",
  "skillgate_ai.checks_show",
  "skillgate_ai.cli",
  "skillgate_ai.mcp",
]

[[tool.importlinter.contracts]]
name = "HTTP surface does not import CLI or MCP"
type = "forbidden"
source_modules = [
  "skillgate_ai.api",
  "skillgate_ai.api_payloads",
  "skillgate_ai.api_models",
  "skillgate_ai.api_intake",
  "skillgate_ai.api_evals",
  "skillgate_ai.api_skills",
  "skillgate_ai.api_runs",
  "skillgate_ai.api_compare",
  "skillgate_ai.api_shims",
  "skillgate_ai.server",
]
forbidden_modules = [
  "skillgate_ai.cli",
  "skillgate_ai.mcp",
]

[[tool.importlinter.contracts]]
name = "FS primitives are leaves"
type = "forbidden"
source_modules = [
  "skillgate_ai.path_traversal",
  "skillgate_ai.allow_root",
  "skillgate_ai.agent_roots",
]
forbidden_modules = [
  "skillgate_ai.fs_anchor",
  "skillgate_ai.paths",
  "skillgate_ai.trusted_roots",
  "skillgate_ai.contained_fs",
  "skillgate_ai.pack_layout",
  "skillgate_ai.pack_io",
]

