services:
  skillgate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: skillgate:local
    pull_policy: build
    user: "1001:1001"
    volumes:
      - ${PACK:-./skills/sample-skill}:/pack
    # CLI exits; no ports. Default ENTRYPOINT/CMD → skillgate check /pack
    # Key: -e SKILLGATE_OPENAI_API_KEY (documented CI/Docker path; always read).
    # Ambient OPENAI_API_KEY is ignored unless you also pass --key-env.

  skillgate-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: skillgate:dev
    pull_policy: build
    user: "1001:1001"
    volumes:
      - ./src:/src:ro
      - ${PACK:-./skills/sample-skill}:/pack
    profiles: ["dev"]
