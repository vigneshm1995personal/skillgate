# Publish skillgate-ai to PyPI (Trusted Publishing / OIDC) and the CLI
# image to GHCR. No long-lived PyPI password or API token.
#
# This file must stay named release.yml — that filename is what you enter
# in the PyPI Trusted Publisher form (see docs/proof/PUBLISH.md).
#
# First publish: after merging this workflow to main AND registering the
# pending publisher on pypi.org, run Actions → release → Run workflow
# with tag v0.4.2. Do not put PYPI_API_TOKEN in repo secrets.
#
# PyPI and GHCR stay on the 0.x package tags (v0.*.*). v1.x.y and the
# floating v1 tag are the GitHub Action (uses: vigneshm1995personal/skillgate@v1).
# Those tags do not publish skillgate-ai.

name: release

on:
  push:
    tags:
      - "v0.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. v0.4.2)"
        required: true
        type: string

permissions: {}

jobs:
  build:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build React UI into the wheel
        run: |
          python -m pip install -U pip build
          python -m build
          ls -la dist
          python tests/assert_wheel_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vigneshm1995personal/skillgate'
      && ((github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.')))
    environment:
      name: pypi
      url: https://pypi.org/p/skillgate-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  ghcr:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vigneshm1995personal/skillgate'
      && ((github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.')))
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vigneshm1995personal/skillgate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" --target runtime .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
