# Publish skillgate-ai to PyPI (Trusted Publishing / OIDC) and the CLI
# image to GHCR. No long-lived PyPI password or API token.
#
# This file must stay named release.yml — that filename is what you enter
# in the PyPI Trusted Publisher form (see docs/proof/PUBLISH.md).
#
# First publish: after merging this workflow to main AND registering the
# pending publisher on pypi.org, run Actions → release → Run workflow
# with tag v0.4.2. Do not put PYPI_API_TOKEN in repo secrets.
#
# PyPI and GHCR stay on the 0.x package tags (v0.*.*). v1.x.y and the
# floating v1 tag are the GitHub Action (uses: vigneshm1995personal/skillgate@v1).
# Those tags do not publish skillgate-ai.

name: release

on:
  push:
    tags:
      - "v0.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. v0.4.2)"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_PYTHON_DOWNLOADS: never
  UV_LINK_MODE: copy
  UV_VERSION: "0.12.13"

jobs:
  gate:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.'))
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  build:
    needs: gate
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: py3.12-release-build
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build React UI into the wheel
        run: |
          uv build
          ls -la dist
          python tests/assert_wheel_ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vigneshm1995personal/skillgate'
      && ((github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.')))
    environment:
      name: pypi
      url: https://pypi.org/p/skillgate-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          skip-existing: true

  ghcr:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vigneshm1995personal/skillgate'
      && ((github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.')))
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vigneshm1995personal/skillgate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" --target runtime .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"