# Publish skillgate-ai to PyPI (Trusted Publishing / OIDC) and the CLI
# image to GHCR. No long-lived PyPI password or API token.
#
# This file must stay named release.yml — that filename is what you enter
# in the PyPI Trusted Publisher form (see docs/proof/PUBLISH.md).
#
# First publish: after merging this workflow to main AND registering the
# pending publisher on pypi.org, run Actions → release → Run workflow
# with tag v0.4.2. Do not put PYPI_API_TOKEN in repo secrets.
#
# PyPI and GHCR stay on the 0.x package tags (v0.*.*). v1.x.y and the
# floating v1 tag are the GitHub Action (uses: vigneshm1995personal/skillgate@v1).
# Those tags do not publish skillgate-ai.

name: release

on:
  push:
    tags:
      - "v0.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. v0.4.2)"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_PYTHON_DOWNLOADS: never
  UV_LINK_MODE: copy
  UV_VERSION: "0.12.13"

jobs:
  gate:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.'))
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  build:
    needs: gate
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: py3.12-release-build
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build React UI into the wheel
        run: |
          uv build
          ls -la dist
          python tests/assert_wheel_ui.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vigneshm1995personal/skillgate'
      && ((github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.')))
    environment:
      name: pypi
      url: https://pypi.org/p/skillgate-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  ghcr:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vigneshm1995personal/skillgate'
      && ((github.event_name == 'push' && startsWith(github.ref_name, 'v0.'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v0.')))
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vigneshm1995personal/skillgate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" --target runtime .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"