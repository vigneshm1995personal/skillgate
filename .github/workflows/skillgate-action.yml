name: skillgate-action

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: gate
        continue-on-error: true
        uses: ./
        with:
          path: skills/pdf
          args: --no-judge
      - name: Assert keyless check exits 2
        run: |
          code="${{ steps.gate.outputs.exit-code }}"
          result="${{ steps.gate.outputs.result }}"
          detail="${{ steps.gate.outputs.detail }}"
          echo "skillgate check exit ${code} (${result})"
          echo "detail: ${detail}"
          test "$code" = "2"
          test "$result" = "cannot-run"
          test "$detail" = "No agent is available to run checks."
